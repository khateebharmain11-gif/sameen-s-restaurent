<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | SAMEEN'S RESTAURENT</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="site-nav"></div>

    <section class="page-heading">
        <div class="container">
            <span class="eyebrow">WE WOULD LOVE TO HEAR FROM YOU</span>
            <h1>Say <em>Hello.</em></h1>
            <p>We are always happy to connect with you.</p>
        </div>
    </section>

    <section class="container section-pad">

        <div class="row g-5">

            <div class="col-lg-5">

                <span class="eyebrow">VISIT OR CONNECT</span>

                <h2 class="section-title">
                    Let's make<br>
                    <em>it delicious.</em>
                </h2>

                <p class="body-copy">
                    Have a question or a special request?
                    Contact SAMEEN'S.
                </p>

                <p>
                    <strong>Address</strong><br>
                    Tambaram, Chennai, Tamil Nadu, India
                </p>

                <p>
                    <strong>Phone</strong><br>
                    +91 9876543210
                </p>

                <p>
                    <strong>Email</strong><br>
                    hello@sameens.example
                </p>

            </div>

            <div class="col-lg-7">

                <form class="contact-form"
    onsubmit="event.preventDefault(); alert(\"Thank you for contacting SAMEEN'S!\"); this.reset();">
                    <label>Your Name</label>
                    <input type="text" class="form-control" required placeholder="Enter your name">

                    <label>Email Address</label>
                    <input type="email" class="form-control" required placeholder="Enter your email">

                    <label>Phone Number</label>
                    <input type="tel" class="form-control" placeholder="Enter your phone number">

                    <label>Your Message</label>
                    <textarea class="form-control" rows="5" required placeholder="Write your message"></textarea>

                    <button type="submit" class="btn btn-gold mt-4">
                        Send Message
                    </button>

                </form>

            </div>

        </div>

    </section>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>

</body>

</html>
