<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | SAMEEN'S</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="site-nav"></div>

<section class="page-heading">
    <div class="container">
        <span class="eyebrow">ALMOST THERE</span>
        <h1>Complete Your <em>Order.</em></h1>
    </div>
</section>

<section class="container section-pad">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <form id="checkout-form" class="contact-form">

                <div id="checkout-summary" class="mb-4"></div>

                <h3 class="mb-4">Customer Details</h3>

                <label>Full Name</label>
                <input
                    type="text"
                    name="name"
                    class="form-control"
                    required
                    placeholder="Enter your full name">

                <label>Phone Number</label>
                <input
                    type="tel"
                    name="phone"
                    class="form-control"
                    required
                    placeholder="Enter your phone number">

                <label>Delivery Address</label>
                <textarea
                    name="address"
                    class="form-control"
                    rows="4"
                    required
                    placeholder="Enter your complete address"></textarea>

                <label>Payment Method</label>

                <select name="payment" class="form-select">
                    <option>Cash on Delivery</option>
                    <option>Pay at Restaurant</option>
                </select>

                <p class="small mt-3" style="color:#777;">
                    Demo checkout only. No actual payment is collected.
                </p>

                <button type="submit" class="btn btn-gold w-100 mt-3">
                    PLACE ORDER
                </button>

            </form>

        </div>

    </div>

</section>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
